id: cbt-adhd-foundations
title: "Mastering Your Mind: CBT Program for ADHD"
condition: "Attention-Deficit/Hyperactivity Disorder"
summary: "A seven-module CBT journey that builds the bridge between intention and action. Learn practical routines, get unstuck, strengthen attention, organize your world, solve problems thoughtfully, and care for your emotions—with self-compassion at the center."
duration: "7 modules • 4–6 weeks self‑paced"
focusAreas:
  - "Executive functioning"
  - "Emotional regulation"
  - "Daily structure"
  - "Self-compassion"
modules:
  - title: "Module 1 • Understanding Your ADHD"
    overview:
      - "Welcome to your program. This is not about fixing you—you are not broken. It's about learning to work with your brain and building a kinder, more effective way of living."
      - "ADHD often reflects a gap between intention and action. Think of your brain's \"Dreamer\" (Default Mode Network) and \"Doer\" (Task Positive Network). Our work is to strengthen the bridge between them."
      - "CBT gives you a practical map: connect thoughts, feelings, and behaviors; then change your life by changing what you do next—kindly and consistently."
      - "Progress grows from small, repeatable actions. Perfection is not required. Practice is." 
    takeaways:
      - "Small, precise commitments practiced daily strengthen the bridge between thought and action."
      - "Self-compassion fuels motivation better than self‑criticism."
      - "Clarity beats willpower: specific plans lower friction and help you start."
    narrative:
      - section: "A proven path forward"
        paragraphs:
          - "For the past decade, I've worked with hundreds of adults with ADHD—from one‑on‑one clients to students in structured CBT programs. The aim has always been the same: practical skills that help in real life, not just ideas on a page."
          - "Through this work, I've learned that the single greatest predictor of change isn't how severe your challenges are—it's your commitment to doing the work in small, consistent ways."
          - "Consider this program a personal challenge. Many people move from constant struggle to a sense of capability and self‑respect by learning to work with their brain rather than against it."
          - "If you take only one thing from Module 1, let it be this: you can improve. You can close the gap between intention and action."
          - "The effort you invest now is a direct gift to your future self—the one who will thank you for getting started today."
        exerciseAfter: 0
      - section: "Welcome: Your journey begins now"
        paragraphs:
          - "Welcome to Mastering Your Mind. Living with ADHD brings unique challenges—and also unique strengths. This program helps you understand your own mind and apply CBT skills across attention, impulsivity, organization, and emotional regulation."
          - "This isn't about fixing you. You are not broken. It's about working with your wiring, harnessing your strengths, and building a life that feels more manageable and meaningful."
      - section: "How to engage with this program"
        paragraphs:
          - "Deep work matters. Create a small pocket of focused time and reduce distractions. Go beyond surface reading—practice what you read."
          - "Read for insight (the 'why') and do the exercises for action (the 'how'). The bridge between knowing and doing is where change happens."
        exerciseAfter: 0
      - section: "What is Cognitive Behavioural Therapy (CBT)?"
        paragraphs:
          - "CBT helps you see the link between Thoughts (what you tell yourself), Feelings (what you experience), and Behaviours (what you do)."
          - "For ADHD, CBT often means practical strategies for planning, starting tasks, staying focused, and regulating emotions—so your actions line up with your values."
      - section: "Understanding your ADHD experience"
        paragraphs:
          - "ADHD shows up differently for everyone—commonly as inattention, hyperactivity, and impulsivity. These patterns are differences in brain function, not character flaws. Identifying your patterns is the first step toward effective strategies."
      - section: "Your brain's two modes: the Dreamer and the Doer"
        paragraphs:
          - "Think of the Default Mode Network (DMN) as the Dreamer—it plans, imagines, and reflects. The Task Positive Network (TPN) is the Doer—it executes with focused attention."
          - "With ADHD, the bridge between Dreamer and Doer can be unreliable. You can strengthen it through small, precise, immediate commitments."
        exerciseAfter: 1
      - section: "Information that makes your brain click"
        paragraphs:
          - "This program is both insight and practice. It's designed to help ideas click into place and guide you toward what actually works for you."
      - section: "The power of self‑compassion"
        paragraphs:
          - "Progress isn't linear. Treat yourself like you would a friend on a hard day—kindness fuels motivation far more than self‑criticism."
    exercises:
      - "Write your \"why\": two sentences on why you chose this program right now."
      - "Set a micro‑intention: pick a tiny action and a precise time (e.g., \"At 7:00 I stand up and drink a glass of water\"). Execute perfectly once."
      - "Define 1–3 SMART process goals for the next 7 days (e.g., \"Do a 5‑minute planning check each evening\")."
    homework:
      - "Reflect on inattention/hyperactivity/impulsivity this week—capture two specific situations without judgment."
      - "List strengths and supports you bring (creativity, humor, persistence, allies)."
      - "Write a one‑sentence self‑compassion pledge to revisit on hard days."
      - "Practice one micro‑intention daily. Note: planned time, action, did it (Y/N)."
  - title: "Module 2 • Building Structure and Routine"
    overview:
      - "Structure reduces decision fatigue and creates gentle predictability—both are ADHD super‑supports."
      - "Start with foundational anchors (sleep, wake, meals) and tiny morning/evening routines. Keep them short and winnable."
      - "Improve time awareness with estimation drills and simple paper‑based time blocking."
    takeaways:
      - "Anchors turn good intentions into low‑friction defaults."
      - "Time awareness is a trainable skill; practice beats guessing."
    exercises:
      - "Design a 3‑step morning and 3‑step evening routine you can actually do this week."
      - "Time estimation drill: estimate one task, time it, compare. Repeat daily."
      - "Create a simple paper time‑block for tomorrow (fixed items → anchors → 2–3 flexible blocks)."
    homework:
      - "Track target vs. actual wake/sleep for 7 days."
      - "Each evening, map tomorrow with simple time blocks and name one Must‑Do, one Should‑Do, one Want‑To‑Do."
      - "End‑of‑week reflection: what stuck, what slipped, what surprised you about time?"
  - title: "Module 3 • Overcoming Procrastination"
    overview:
      - "Procrastination is an emotion regulation strategy, not a moral failure. Reduce overwhelm and starting becomes possible."
      - "Break tasks into physical, first‑move actions and use the 5‑Minute Rule to cross the start line."
      - "Link small steps to existing cues or rewards to harness momentum."
    takeaways:
      - "Tiny, concrete first actions dissolve avoidance."
      - "Five minutes often becomes fifteen—but credit yourself even when it doesn’t."
    exercises:
      - "Paper & pen breakdown: pick one avoided task and list major steps → micro‑steps → circle the absolute first physical action."
      - "Schedule one 5‑minute start on that first action today. Timer on."
      - "Create a \"link\": pair a small step with a frequent cue (e.g., \"after coffee, open the doc and write one sentence\")."
    homework:
      - "Break down two additional tasks this week. Identify the first physical action for each."
      - "Apply the 5‑Minute Rule 3–5 times. Log start, stop/continue, and feelings after."
      - "Experiment with one cue/reward pair daily; note which pairings help you return."
  - title: "Module 4 • Enhancing Focus"
    overview:
      - "Attention is a trainable muscle—create the right conditions and practice gentle redirection."
      - "Reduce external distractions (space, noise, interruptions) and manage internal ones (thoughts, worries, restlessness)."
      - "Use a Distraction Pad and 3‑minute breath practice to notice and return without self‑blame."
    takeaways:
      - "Environmental tweaks compound."
      - "Noticing and returning is the practice. Judgment is optional."
    exercises:
      - "Make a distraction inventory: top 2 external and top 2 internal distractors."
      - "Implement one environmental change today (e.g., clear desk zone, earplugs, \"focus spot\")."
      - "3‑minute breath focus: notice wandering, gently return; jot one sentence about the experience."
    homework:
      - "Use a Distraction Pad during two focus sessions; review afterwards."
      - "Daily: one short attention practice (breath, grounding, or intentional movement). Track which felt most helpful."
      - "Adopt at least one environmental change for the full week; note effects on focus."
  - title: "Module 5 • Organizing Your Life"
    overview:
      - "External order supports internal calm. Create \"homes\" for key items and declutter in short, repeatable sprints."
      - "Keep paper moving with a simple Inbox → Action → File flow."
    takeaways:
      - "Systems beat memory. Labels beat guesses."
      - "Short, timed sessions trump heroic marathons."
    exercises:
      - "Choose one small, bounded area (one shelf/drawer/surface). Do a 15‑minute declutter using Keep / Relocate‑Action / Donate‑Discard."
      - "Define \"homes\" for 3–5 frequently misplaced items; label if useful."
      - "Set up your paper \"Inbox\" and \"Action\" trays if missing."
    homework:
      - "Run two 15‑minute declutters on the same area; process \"Relocate‑Action\" items immediately after."
      - "Process your paper Inbox twice using Action / File / Discard; add actions to your list."
      - "Track how often key items return to their \"homes\"; adjust placements if friction remains."
      - "Reflect on space ↔ mood/focus link this week."
  - title: "Module 6 • Challenges and Emotions"
    overview:
      - "Use a 5‑step problem‑solving model to move from overwhelm to action."
      - "Build emotional regulation basics: notice & name, STOPP, grounding, and self‑soothing."
    takeaways:
      - "Pause creates possibility: a breath can change the next decision."
      - "You can’t always choose feelings—but you can choose your next step."
    exercises:
      - "Pick one recurring problem. Write Step 1–5: define → brainstorm → evaluate → implement → review (brief bullets)."
      - "Practice STOPP on a recent surge: Stop, Breath, Observe, Pull Back, Proceed. Write one sentence on what would change."
      - "Try one grounding technique today (Box Breathing or 5‑4‑3‑2‑1)."
    homework:
      - "Work through all 5 problem‑solving steps on paper; schedule and execute the first action."
      - "Track 2–3 emotional triggers across the week; log which technique you tried and its effect."
      - "Maintain your \"homes\" and paper flow; declutter one new tiny area once."
      - "End‑of‑week reflection: what you learned about triggers, tools, and what helps fastest."
  - title: "Module 7 • Maintaining Momentum"
    overview:
      - "Consolidate progress and design a relapse‑prevention plan you’ll actually use."
      - "Commit to core routines, schedule reviews, and keep learning with self‑compassion."
    takeaways:
      - "Review, refine, recommit—this is how habits stick."
      - "Support beats solo: share one insight with someone you trust."
    exercises:
      - "Looking back: capture top 2–3 skills, 1–3 changes made, and strengths you used."
      - "Relapse plan: list 2–3 triggers, 2–3 early warning signs, and 3–5 \"get back on track\" actions."
      - "Schedule your first 15–30 min monthly \"Personal System Review.\""
    homework:
      - "Write a one‑sentence commitment to 1–3 core routines (e.g., daily plan, weekly review)."
      - "Put the first monthly review on your calendar; add review prompts that matter to you."
      - "Share one insight with a support person; note their suggestion."
      - "Create your quick‑reference list: \"My Go‑To ADHD Strategies\" (5–7 items)."
