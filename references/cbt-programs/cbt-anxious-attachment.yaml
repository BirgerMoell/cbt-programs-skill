id: cbt-anxious-attachment
title: "From Anxious to Secure: Transforming Your Attachment Style"
condition: "Anxious Attachment"
summary: "A comprehensive seven-module CBT program designed to help you transform anxious attachment patterns into secure attachment. Learn to manage relationship anxiety, challenge core beliefs, regulate emotions, communicate needs effectively, and build the secure attachment style that leads to healthier, more fulfilling relationships."
duration: "7 modules • 6–8 weeks self‑paced"
focusAreas:
  - "Understanding anxious attachment"
  - "Managing relationship anxiety"
  - "Cognitive restructuring"
  - "Emotional regulation"
  - "Secure communication"
  - "Building secure attachment"
image: "images/anxious-attachment-hero.jpg"
modules:
  - title: "Module 1 • Understanding Anxious Attachment: The Foundation"
    image: "images/module1-understanding.jpg"
    overview:
      - "Anxious attachment isn't a flaw—it's a learned pattern of relating that developed as a way to protect yourself. Understanding this pattern is the first step toward transforming it."
      - "This module helps you understand how anxious attachment develops, recognize its characteristics in your relationships, and see the path toward secure attachment."
      - "Knowledge is power. When you understand your attachment style, you can begin to change it. This module gives you that foundation."
    takeaways:
      - "Anxious attachment is a learned pattern, not a character flaw—it can be changed."
      - "Understanding your attachment style helps you recognize patterns and make different choices."
      - "Secure attachment is achievable—many people successfully transform their attachment style."
      - "Self-awareness is the first step: noticing your patterns without judgment."
    narrative:
      - section: "You are not broken"
        paragraphs:
          - "If you're here, you've likely experienced the pain of anxious attachment: the constant worry about relationships, the fear of abandonment, the need for reassurance, the tendency to read into every text message, every silence, every interaction."
          - "You might have been told you're 'too needy' or 'too sensitive.' You might have blamed yourself for relationship problems. But here's the truth: anxious attachment isn't a character flaw. It's a learned pattern of relating that developed as a way to protect yourself."
          - "As a child, you learned that love and attention were unpredictable. Maybe a caregiver was inconsistent—sometimes available, sometimes not. Maybe you had to work hard to get attention. Maybe you learned that expressing needs led to rejection or withdrawal."
          - "Your brain adapted. It learned to be hypervigilant to relationship cues. It learned to seek reassurance constantly. It learned that your needs might not be met, so it amplified them. This wasn't a choice—it was survival."
          - "The good news? What was learned can be unlearned. What was adapted can be readapted. You can transform anxious attachment into secure attachment. This program shows you how."
        exerciseAfter: 0
      - section: "What is anxious attachment?"
        paragraphs:
          - "Anxious attachment (also called anxious-preoccupied attachment) is characterized by: High anxiety about relationships, Fear of abandonment, Constant need for reassurance, Hypervigilance to partner's moods and behaviors, Tendency to read into situations, Difficulty trusting that love is stable, and Tendency to lose yourself in relationships."
          - "People with anxious attachment often: Worry that partners don't love them as much as they love their partners, Interpret neutral behaviors as rejection, Need frequent contact and reassurance, Feel anxious when partners are independent, Struggle with boundaries, and Have difficulty being alone."
          - "These patterns aren't random—they're strategies your brain developed to manage the fear of losing connection. Understanding this helps you see them as patterns, not truths."
        exerciseAfter: 1
      - section: "How anxious attachment develops"
        paragraphs:
          - "Attachment styles develop in childhood through interactions with primary caregivers. Anxious attachment typically develops when: Caregivers were inconsistent (sometimes responsive, sometimes not), Caregivers were anxious themselves (modeling anxiety), Caregivers were overwhelmed (couldn't meet needs consistently), or Caregivers used love as a reward (conditional attention)."
          - "As a child, you learned: 'I need to work hard to get love.' 'Love is unpredictable.' 'I'm not worthy of consistent care.' 'I need to be perfect to be loved.' These beliefs became your blueprint for relationships."
          - "These beliefs aren't true—they're learned. And they can be unlearned. This program helps you do that."
        exerciseAfter: 2
      - section: "The path to secure attachment"
        paragraphs:
          - "Secure attachment is characterized by: Comfort with intimacy and independence, Trust that love is stable, Ability to communicate needs directly, Healthy boundaries, Self-worth that doesn't depend on others' approval, and Ability to be alone without anxiety."
          - "Secure attachment isn't about never feeling anxious—it's about managing anxiety effectively, trusting yourself and your partner, and maintaining your sense of self in relationships."
          - "The path to secure attachment involves: Understanding your patterns, Challenging core beliefs, Regulating emotions, Communicating effectively, Setting boundaries, and Building self-worth."
          - "This program guides you through each step. Change is possible. Secure attachment is achievable."
    exercises:
      - "Attachment style reflection: Write about your earliest memories of seeking comfort or attention. What patterns do you notice?"
      - "Pattern identification: List 5 behaviors or thoughts you have in relationships that might relate to anxious attachment."
      - "Relationship timeline: Create a timeline of your significant relationships. What patterns do you see? How has anxious attachment shown up?"
    homework:
      - "Attachment journal: For one week, journal about your relationship thoughts and feelings. Notice when anxiety appears. What triggers it?"
      - "Pattern observation: This week, observe your anxious attachment patterns without judgment. Just notice. What do you see?"
      - "Secure attachment vision: Write about what secure attachment would look like for you. What would change? How would you feel?"
      - "Self-compassion practice: When you notice anxious patterns, practice self-compassion. 'This is a learned pattern. I'm learning to change it. That's okay.'"
  - title: "Module 2 • Challenging Core Beliefs: Rewriting Your Relationship Blueprint"
    image: "images/module2-beliefs.jpg"
    overview:
      - "Core beliefs are the foundation of anxious attachment. Beliefs like 'I'm not worthy of love' or 'People always leave' drive anxious behaviors. This module teaches you to identify, challenge, and rewrite these beliefs."
      - "You'll learn cognitive restructuring techniques to replace anxious beliefs with secure ones. This isn't positive thinking—it's accurate thinking based on evidence."
      - "Changing beliefs changes behavior. When you believe you're worthy of stable love, you act differently. This module shows you how."
    takeaways:
      - "Core beliefs drive anxious behaviors: change the beliefs, change the behaviors."
      - "Beliefs are thoughts, not facts: you can challenge and change them."
      - "Evidence-based thinking replaces anxious thinking: look for facts, not fears."
      - "New beliefs need practice: repetition creates new patterns."
    narrative:
      - section: "The power of core beliefs"
        paragraphs:
          - "Your core beliefs are the foundation of your attachment style. They're the deep-seated thoughts about yourself, others, and relationships that drive your behavior."
          - "Common anxious attachment beliefs include: 'I'm not worthy of love.' 'People always leave.' 'I need to be perfect to be loved.' 'If someone doesn't respond, they don't care.' 'I'm too much.' 'I need constant reassurance to feel secure.' 'I can't be happy alone.'"
          - "These beliefs aren't facts—they're learned thoughts. But they feel true because you've lived them. They've become your reality. The good news? You can change your reality by changing your beliefs."
        exerciseAfter: 0
      - section: "Identifying your core beliefs"
        paragraphs:
          - "To change beliefs, you first need to identify them. Notice your thoughts in relationships. When you feel anxious, what are you thinking? When you seek reassurance, what belief is driving that?"
          - "Common triggers for anxious beliefs: Partner doesn't respond quickly, Partner spends time with others, Partner seems distant, Conflict or disagreement, Partner expresses independence, or Uncertainty about the relationship."
          - "When triggered, ask yourself: 'What am I believing right now?' 'What does this situation mean to me?' 'What am I afraid will happen?'"
          - "Your answers reveal your core beliefs. Write them down. Name them. This is the first step to changing them."
        exerciseAfter: 1
      - section: "Challenging anxious beliefs"
        paragraphs:
          - "Once you identify a belief, challenge it. Ask: 'Is this belief true? What's the evidence?' 'What's an alternative explanation?' 'What would I tell a friend who had this belief?' 'What's a more balanced view?'"
          - "For example, if you believe 'If they don't respond, they don't care,' challenge it: 'What's the evidence? Maybe they're busy. Maybe they didn't see the message. Maybe they need space. I don't know why they haven't responded, and that's okay.'"
          - "Challenging beliefs doesn't mean ignoring problems. It means thinking accurately instead of anxiously. It means considering multiple possibilities instead of jumping to the worst conclusion."
        exerciseAfter: 2
      - section: "Developing secure beliefs"
        paragraphs:
          - "As you challenge anxious beliefs, develop secure ones. Secure beliefs include: 'I am worthy of love and care.' 'Love can be stable and consistent.' 'I can communicate my needs directly.' 'I can be happy alone and in relationships.' 'My worth doesn't depend on others' approval.' 'I can trust myself to handle relationship challenges.'"
          - "These beliefs feel foreign at first. That's normal. You're creating new neural pathways. Practice them. Repeat them. Act as if they're true. Over time, they become your reality."
          - "Write your new beliefs. Read them daily. When anxious beliefs appear, replace them with secure ones. Repetition creates change."
      - section: "The thought-feeling-behavior connection"
        paragraphs:
          - "CBT teaches that thoughts create feelings, which create behaviors. Anxious thoughts ('They don't love me') create anxious feelings (fear, sadness), which create anxious behaviors (seeking reassurance, reading into texts)."
          - "When you change the thought ('I don't know how they feel, and that's okay'), you change the feeling (calm, secure), which changes the behavior (trusting, giving space)."
          - "This isn't about suppressing feelings—it's about changing the thoughts that create them. When you think accurately, you feel appropriately, and you act effectively."
    exercises:
      - "Belief identification: List 5 core beliefs you have about relationships. Which ones feel most true? Which cause the most anxiety?"
      - "Belief challenge: Choose one anxious belief. Challenge it. What's the evidence? What's an alternative view? Write it down."
      - "Secure belief creation: Create 5 secure beliefs to replace anxious ones. Write them. Read them daily."
    homework:
      - "Belief journal: This week, track your anxious beliefs. When do they appear? What triggers them? Challenge each one."
      - "Thought record: Use a thought record to track: Situation, Thought, Feeling, Evidence for thought, Evidence against thought, Alternative thought, New feeling."
      - "Belief replacement: When anxious beliefs appear, practice replacing them with secure ones. Notice how it changes your feelings and behaviors."
      - "Daily affirmations: Read your secure beliefs daily. Say them out loud. Write them. Make them real."
  - title: "Module 3 • Emotional Regulation: Managing Relationship Anxiety"
    image: "images/module3-emotions.jpg"
    overview:
      - "Anxious attachment creates intense emotions: fear, anxiety, sadness, anger. This module teaches you to regulate these emotions effectively, so they don't control your behavior."
      - "You'll learn mindfulness, distress tolerance, and emotional regulation techniques that help you stay calm and grounded in relationships."
      - "When you can regulate your emotions, you can respond instead of react. You can communicate clearly instead of anxiously. You can be present instead of panicked."
    takeaways:
      - "Emotions are information, not commands: you can feel anxious without acting anxiously."
      - "Regulation is a skill: you can learn to manage intense emotions effectively."
      - "Mindfulness creates space: between feeling and reacting, you can choose your response."
      - "Self-soothing is essential: you can calm yourself without relying on others."
    narrative:
      - section: "Understanding relationship anxiety"
        paragraphs:
          - "Relationship anxiety is intense. It's the racing heart when your partner doesn't respond. The tight chest when they seem distant. The overwhelming fear that they're leaving. The desperate need to know they still care."
          - "This anxiety isn't random—it's your nervous system responding to perceived threat. Your brain learned that relationships are unsafe, so it activates your fight-or-flight response. Your body responds as if you're in danger, even when you're not."
          - "The problem? This anxiety drives anxious behaviors: constant texting, seeking reassurance, reading into everything, losing yourself in the relationship. These behaviors, intended to secure connection, often push partners away."
          - "The solution? Learn to regulate the anxiety so it doesn't drive your behavior. Feel the anxiety, but don't let it control you. This module shows you how."
        exerciseAfter: 0
      - section: "Mindfulness: creating space between feeling and reacting"
        paragraphs:
          - "Mindfulness is paying attention to the present moment without judgment. When you're anxious, your mind is usually in the future (worrying about what might happen) or the past (replaying what happened). Mindfulness brings you back to now."
          - "Practice: When anxiety appears, pause. Notice: 'I'm feeling anxious.' Name it: 'This is anxiety.' Observe it: 'My heart is racing. My thoughts are spinning.' Don't judge it. Don't try to fix it. Just notice it."
          - "This creates space. Between the feeling and your reaction, there's a moment. In that moment, you can choose. You can choose to text anxiously, or you can choose to breathe. You can choose to seek reassurance, or you can choose to trust."
          - "Mindfulness doesn't eliminate anxiety—it gives you power over it. You feel it, but you're not controlled by it."
        exerciseAfter: 1
      - section: "Distress tolerance: riding the wave"
        paragraphs:
          - "Anxiety is like a wave. It rises, peaks, and falls. If you try to escape it (by seeking reassurance, checking texts, reading into situations), you reinforce it. If you ride it, it passes."
          - "Distress tolerance techniques help you ride the wave: Deep breathing (calms your nervous system), Grounding (5-4-3-2-1: name 5 things you see, 4 you feel, 3 you hear, 2 you smell, 1 you taste), Self-soothing (comfort yourself with kindness), and Acceptance (this feeling will pass)."
          - "Practice: When anxiety hits, don't act. Breathe. Ground yourself. Soothe yourself. Accept the feeling. Wait. The wave will pass. You don't need to do anything."
        exerciseAfter: 2
      - section: "Emotional regulation strategies"
        paragraphs:
          - "Beyond mindfulness and distress tolerance, these strategies help regulate emotions: Check the facts (is your emotion based on facts or fears?), Opposite action (if anxiety makes you want to seek reassurance, do the opposite—give space), Problem-solving (if there's a real problem, solve it; if not, let it go), and Self-care (sleep, nutrition, exercise, connection all regulate emotions)."
          - "Emotional regulation isn't about never feeling anxious—it's about feeling anxious without being controlled by it. It's about responding effectively instead of reacting anxiously."
          - "Practice these strategies regularly. Build them into your daily routine. When anxiety appears, you'll have tools ready."
      - section: "Communicating emotions effectively"
        paragraphs:
          - "Anxious attachment often leads to emotional communication that overwhelms partners. Learning to communicate emotions effectively is crucial."
          - "Effective emotional communication: Name the emotion ('I'm feeling anxious'), Share the trigger ('When you didn't respond, I felt worried'), Express the need ('I'd appreciate if you could let me know when you'll be unavailable'), and Avoid blame ('I'm not saying you did anything wrong—I'm sharing my experience')."
          - "This is different from anxious communication: 'Why didn't you respond? Don't you care? Are you ignoring me?' Effective communication invites connection. Anxious communication pushes partners away."
    exercises:
      - "Anxiety awareness: This week, notice when anxiety appears. What triggers it? How does it feel in your body? What thoughts come with it?"
      - "Mindfulness practice: Practice 5 minutes of mindfulness daily. Notice your thoughts and feelings without judgment."
      - "Distress tolerance: When anxiety hits, practice riding the wave. Breathe. Ground yourself. Wait. Notice what happens."
    homework:
      - "Emotion log: Track your emotions this week. What triggers them? How do you respond? What helps regulate them?"
      - "Mindfulness practice: Daily mindfulness for 5–10 minutes. Build the skill. Notice how it affects your anxiety."
      - "Distress tolerance practice: When anxiety appears, practice distress tolerance techniques. Don't act on the anxiety. Ride the wave."
      - "Emotional communication: Practice communicating emotions effectively. Use 'I' statements. Share feelings without blame."
  - title: "Module 4 • Secure Communication: Expressing Needs Without Anxiety"
    image: "images/module4-communication.jpg"
    overview:
      - "Anxious attachment often leads to anxious communication: indirect, needy, or overwhelming. This module teaches you to communicate needs directly, clearly, and securely."
      - "You'll learn to express needs without anxiety, ask for reassurance when appropriate, and communicate in ways that invite connection rather than push partners away."
      - "Secure communication builds trust. Anxious communication erodes it. This module helps you choose secure communication."
    takeaways:
      - "Secure communication is direct, clear, and respectful: it invites connection."
      - "Needs are valid: expressing them directly is healthy, not needy."
      - "Timing matters: choose the right time and place for important conversations."
      - "Listening is as important as speaking: understanding your partner builds connection."
    narrative:
      - section: "The difference between anxious and secure communication"
        paragraphs:
          - "Anxious communication is indirect, emotional, and often overwhelming. It sounds like: 'Why didn't you text me back? Don't you care? Are you ignoring me? I need to know you still love me.'"
          - "Secure communication is direct, clear, and respectful. It sounds like: 'I noticed you didn't respond to my text. I felt a bit anxious. Can we talk about communication expectations?'"
          - "The difference? Anxious communication blames, demands, and overwhelms. Secure communication shares, asks, and invites. Anxious communication pushes partners away. Secure communication brings them closer."
          - "This isn't about never expressing needs—it's about expressing them in ways that work. Secure communication gets needs met. Anxious communication often doesn't."
        exerciseAfter: 0
      - section: "Expressing needs directly"
        paragraphs:
          - "Your needs are valid. Expressing them is healthy. The key is how you express them."
          - "Secure need expression: 'I need [specific need].' 'It would help me if [specific request].' 'I'd appreciate [specific action].' 'When [situation], I feel [emotion]. I need [specific need].'"
          - "Avoid: 'You never...' 'You always...' 'Why don't you...' 'Don't you care...' These are attacks, not requests. They create defensiveness, not connection."
          - "Practice: Identify a need. Express it directly. Make a specific request. Notice the difference in response."
        exerciseAfter: 1
      - section: "Asking for reassurance appropriately"
        paragraphs:
          - "Sometimes you need reassurance. That's okay. The key is asking appropriately."
          - "Appropriate reassurance requests: 'I'm feeling a bit anxious. Can you help me understand [situation]?' 'I'd appreciate some reassurance about [specific concern].' 'When you [behavior], I feel [emotion]. Can we talk about it?'"
          - "Avoid: Constant checking, Demanding reassurance, Reading into everything, or Making your partner responsible for your anxiety."
          - "Reassurance is a gift, not a demand. Ask when you need it, but don't make it your partner's job to manage your anxiety."
        exerciseAfter: 2
      - section: "Active listening and understanding"
        paragraphs:
          - "Communication isn't just about expressing—it's about understanding. Active listening builds connection."
          - "Active listening: Give full attention, Reflect back what you heard ('So what I'm hearing is...'), Ask clarifying questions ('Can you help me understand...?'), and Validate their experience ('That makes sense. I can see why you'd feel that way.')."
          - "When you listen actively, you understand your partner better. You see their perspective. You build trust. This reduces your anxiety because you understand what's happening instead of imagining the worst."
      - section: "Handling difficult conversations"
        paragraphs:
          - "Difficult conversations are inevitable. Secure communication helps you handle them well."
          - "Framework for difficult conversations: Start with your experience ('I feel...' not 'You make me feel...'), Share the situation ('When [situation], I feel [emotion]'), Express the need ('I need [specific need]'), Listen to their perspective, and Work together on solutions."
          - "Avoid: Blame, Defensiveness, Stonewalling, and Criticism. These are the 'Four Horsemen' that destroy relationships."
          - "Secure communication in difficult conversations builds connection even during conflict. It's a skill you can learn."
    exercises:
      - "Communication audit: Review recent communications. Which were anxious? Which were secure? What patterns do you notice?"
      - "Need expression practice: Identify 3 needs. Practice expressing them securely. Write them down. Say them out loud."
      - "Active listening practice: In your next conversation, practice active listening. Reflect back. Ask questions. Notice the impact."
    homework:
      - "Communication practice: This week, practice secure communication. Express needs directly. Ask for reassurance appropriately."
      - "Need expression: Identify one need. Express it securely to your partner or practice expressing it. Notice the response."
      - "Active listening: Practice active listening in conversations. Give full attention. Reflect back. Ask questions."
      - "Difficult conversation: If there's a difficult topic, practice having it securely. Use the framework. Notice what works."
  - title: "Module 5 • Boundaries and Self-Care: Maintaining Your Sense of Self"
    image: "images/module5-boundaries.jpg"
    overview:
      - "Anxious attachment often leads to losing yourself in relationships. This module teaches you to set boundaries, maintain your identity, and care for yourself while in relationships."
      - "You'll learn that boundaries aren't walls—they're gates. They protect you while allowing connection. You'll learn to balance relationship needs with personal needs."
      - "When you maintain your sense of self, you're more secure in relationships. You don't need constant reassurance because you know who you are, with or without a partner."
    takeaways:
      - "Boundaries protect you and your relationships: they're essential for secure attachment."
      - "You can be close and independent: intimacy and autonomy can coexist."
      - "Self-care isn't selfish: it's essential for healthy relationships."
      - "Your identity matters: maintain it even in relationships."
    narrative:
      - section: "Why boundaries matter"
        paragraphs:
          - "Anxious attachment often leads to boundary-less relationships. You merge with your partner. You lose yourself. You become dependent. You need constant connection to feel okay."
          - "This feels like love, but it's not. It's enmeshment. It's losing yourself in another person. It's making your partner responsible for your happiness, your worth, your identity."
          - "Boundaries are the solution. They're not walls that keep people out—they're gates that protect you while allowing connection. They define where you end and your partner begins."
          - "With boundaries, you can be close and independent. You can love and be yourself. You can need your partner without needing them to complete you."
        exerciseAfter: 0
      - section: "Setting healthy boundaries"
        paragraphs:
          - "Healthy boundaries include: Time boundaries (time for yourself, time for friends, time for hobbies), Emotional boundaries (your emotions are yours; your partner's are theirs), Physical boundaries (your body, your space), and Communication boundaries (when and how you communicate)."
          - "Setting boundaries: Identify your limits ('I need time alone each day'), Communicate them clearly ('I need an hour to myself in the evenings'), Enforce them consistently ('I'm going to take my time now'), and Respect your partner's boundaries too."
          - "Boundaries aren't ultimatums—they're self-care. They're saying: 'I matter. My needs matter. I can be in a relationship and still be me.'"
        exerciseAfter: 1
      - section: "Maintaining your identity"
        paragraphs:
          - "In anxious attachment, identity often gets lost in relationships. You become 'we' and lose 'I.' This creates dependency and anxiety."
          - "Maintain your identity by: Keeping your interests and hobbies, Maintaining friendships, Having your own goals, Spending time alone, and Remembering who you are outside the relationship."
          - "Your identity is valuable. Don't lose it in relationships. When you know who you are, you're more secure. You don't need constant reassurance because you have yourself."
        exerciseAfter: 2
      - section: "Self-care in relationships"
        paragraphs:
          - "Self-care is essential for secure attachment. When you care for yourself, you're less dependent on your partner for validation and security."
          - "Self-care includes: Physical care (sleep, nutrition, exercise), Emotional care (processing feelings, self-compassion), Mental care (learning, growth, stimulation), Social care (friendships, community), and Spiritual care (values, meaning, purpose)."
          - "Self-care isn't selfish—it's necessary. When you're cared for, you can care for others. When you're secure in yourself, you can be secure in relationships."
          - "Make self-care non-negotiable. Schedule it. Protect it. It's as important as relationship time."
      - section: "Balancing needs"
        paragraphs:
          - "Secure attachment involves balancing your needs with your partner's needs. It's not all about you, and it's not all about them—it's about both."
          - "Practice: Identify your needs. Identify your partner's needs. Find ways to meet both. Sometimes you prioritize theirs. Sometimes they prioritize yours. It's a dance, not a battle."
          - "When needs conflict, communicate. Negotiate. Find solutions that work for both. Secure relationships are collaborative, not competitive."
    exercises:
      - "Boundary audit: What boundaries do you have? Which are healthy? Which need work? Where do you lose yourself?"
      - "Identity check: Who are you outside your relationship? What interests? What goals? What values? Write them down."
      - "Self-care plan: Create a self-care plan. What will you do daily? Weekly? How will you protect it?"
    homework:
      - "Boundary setting: Identify one boundary you need. Set it this week. Communicate it. Enforce it. Notice how it feels."
      - "Identity maintenance: This week, do one thing that's just for you. A hobby. A friend. A goal. Maintain your identity."
      - "Self-care practice: Implement your self-care plan. Daily practices. Weekly practices. Protect them. Notice the impact."
      - "Need balancing: Practice balancing your needs with your partner's. Communicate. Negotiate. Find solutions together."
  - title: "Module 6 • Self-Compassion: Building Inner Security"
    image: "images/module6-compassion.jpg"
    overview:
      - "Self-compassion is the foundation of secure attachment. When you're compassionate with yourself, you don't need constant external validation. You have inner security."
      - "This module teaches you to treat yourself with kindness, especially when you're struggling. You'll learn that self-compassion isn't self-pity—it's self-care."
      - "When you have self-compassion, you're more secure in relationships. You don't need your partner to complete you because you're already whole."
    takeaways:
      - "Self-compassion is the antidote to anxious attachment: it builds inner security."
      - "You can be kind to yourself even when you struggle: self-compassion doesn't require perfection."
      - "Inner security reduces relationship anxiety: when you're secure in yourself, you're secure in relationships."
      - "Self-compassion is a practice: it takes time and repetition to develop."
    narrative:
      - section: "The power of self-compassion"
        paragraphs:
          - "Anxious attachment is often driven by self-criticism. 'I'm too needy.' 'I'm not good enough.' 'I'm too much.' 'I don't deserve love.' This self-criticism creates anxiety and drives anxious behaviors."
          - "Self-compassion is the antidote. It's treating yourself with the same kindness you'd show a friend. It's recognizing that you're human, that you're learning, that you're doing your best."
          - "Research shows that self-compassion reduces anxiety, improves relationships, and builds resilience. When you're compassionate with yourself, you don't need constant external validation. You have inner security."
        exerciseAfter: 0
      - section: "The three components of self-compassion"
        paragraphs:
          - "Self-compassion has three components: Self-kindness (treating yourself with warmth and understanding), Common humanity (recognizing that suffering is part of being human), and Mindfulness (observing your experience without judgment)."
          - "Practice: When you're struggling, practice all three. Be kind to yourself ('This is hard, and that's okay'). Recognize common humanity ('Many people struggle with this'). Practice mindfulness ('I'm feeling [emotion], and that's okay')."
          - "Self-compassion doesn't mean ignoring problems—it means addressing them with kindness instead of criticism."
        exerciseAfter: 1
      - section: "Self-compassion in moments of anxiety"
        paragraphs:
          - "When anxiety appears, self-compassion helps. Instead of 'I'm so anxious. What's wrong with me?' try 'I'm feeling anxious. This is hard. Many people feel this way. I'm doing my best.'"
          - "Self-compassion breaks the cycle: Anxiety → Self-criticism → More anxiety → More self-criticism. Self-compassion interrupts this. It says: 'This is hard, and that's okay. You're learning. You're growing.'"
          - "Practice: When anxiety appears, practice self-compassion. Be kind. Recognize common humanity. Stay mindful. Notice how it changes your experience."
        exerciseAfter: 2
      - section: "Building inner security"
        paragraphs:
          - "Self-compassion builds inner security. When you're secure in yourself, you don't need constant external validation. You know your worth. You trust yourself."
          - "Inner security means: You know you're worthy of love, You trust yourself to handle challenges, You don't need others to complete you, and You can be alone without anxiety."
          - "This doesn't mean you don't want relationships—it means you don't need them to be okay. You're already whole. Relationships enhance your life; they don't complete it."
          - "Build inner security through: Self-compassion, Self-care, Self-knowledge, and Self-trust. When you have these, you're secure."
      - section: "Self-compassion practices"
        paragraphs:
          - "Daily self-compassion practices: Self-compassion break (when struggling, pause and practice the three components), Compassionate self-talk (speak to yourself like you'd speak to a friend), Self-compassion journal (write about struggles with compassion), and Loving-kindness meditation (wish yourself and others well)."
          - "Practice regularly. Build self-compassion into your daily routine. When you struggle, you'll have the skill ready."
          - "Self-compassion is a muscle. The more you practice, the stronger it gets. Over time, it becomes natural."
    exercises:
      - "Self-compassion assessment: How compassionate are you with yourself? Rate yourself 1–10. What would make you more compassionate?"
      - "Self-compassion break: Practice the self-compassion break. Notice how it feels. What changes?"
      - "Compassionate self-talk: Practice speaking to yourself with compassion. Write compassionate statements. Say them out loud."
    homework:
      - "Self-compassion practice: Practice self-compassion daily this week. Use the self-compassion break. Notice the impact."
      - "Compassionate journal: Journal about struggles with self-compassion. Be kind. Recognize common humanity. Stay mindful."
      - "Inner security building: Practice building inner security. Self-compassion. Self-care. Self-knowledge. Self-trust."
      - "Loving-kindness meditation: Practice loving-kindness meditation daily. Wish yourself and others well. Notice how it feels."
  - title: "Module 7 • Building Secure Attachment: Integration and Maintenance"
    image: "images/module7-integration.jpg"
    overview:
      - "This final module helps you integrate everything you've learned into a sustainable practice of secure attachment. You'll create a plan for maintaining progress and continuing growth."
      - "You'll learn that secure attachment is a journey, not a destination. It requires ongoing practice, but it becomes easier over time."
      - "You'll develop confidence in your ability to maintain secure attachment patterns and handle relationship challenges with security and grace."
    takeaways:
      - "Secure attachment is a practice: it requires ongoing effort, but it becomes easier."
      - "Progress isn't linear: setbacks are normal; return to the basics when they happen."
      - "Support helps: don't do this alone—seek help when needed."
      - "Celebrate progress: acknowledge how far you've come."
    narrative:
      - section: "Your journey to secure attachment"
        paragraphs:
          - "You've come a long way. You've learned about anxious attachment. You've challenged core beliefs. You've regulated emotions. You've communicated securely. You've set boundaries. You've practiced self-compassion."
          - "This is significant work. Transforming attachment styles isn't easy. It requires courage, commitment, and practice. You've done that. Acknowledge it. Celebrate it."
          - "Secure attachment is a journey, not a destination. You'll continue to grow. You'll face challenges. You'll learn and adapt. That's okay. That's growth."
        exerciseAfter: 0
      - section: "Maintaining secure attachment patterns"
        paragraphs:
          - "Maintaining secure attachment requires ongoing practice: Continue challenging anxious beliefs, Practice emotional regulation, Communicate securely, Maintain boundaries, Practice self-compassion, and Seek support when needed."
          - "Build these practices into your daily life. Make them habits. When challenges arise, you'll have skills ready."
          - "Secure attachment becomes easier over time. The patterns become natural. The skills become automatic. But they still require attention and practice."
        exerciseAfter: 1
      - section: "Handling setbacks"
        paragraphs:
          - "Setbacks are normal. You'll have days when anxiety appears. When old patterns return. When you struggle. That's okay. That's human."
          - "When setbacks happen: Be compassionate with yourself, Return to the basics (challenge beliefs, regulate emotions, communicate securely), Seek support if needed, and Remember that progress isn't linear."
          - "Setbacks don't mean failure. They mean you're human. Learn from them. Return to your practices. Keep going."
        exerciseAfter: 2
      - section: "Continuing growth"
        paragraphs:
          - "Your growth doesn't end here. Continue learning. Continue practicing. Continue growing."
          - "Ways to continue growth: Regular self-reflection, Ongoing therapy or support, Reading and learning, Practicing in relationships, and Helping others on their journey."
          - "Growth is ongoing. Secure attachment deepens over time. Keep practicing. Keep growing."
      - section: "Your secure attachment future"
        paragraphs:
          - "Imagine your future with secure attachment: You feel secure in relationships, You communicate needs directly, You maintain boundaries, You practice self-compassion, You trust yourself and your partner, and You're happy alone and in relationships."
          - "This is possible. You've learned the skills. You've practiced them. You can continue. You can maintain. You can thrive."
          - "Secure attachment isn't about perfection—it's about progress. It's about being secure enough to be vulnerable, to love, to be loved, to be yourself."
          - "You've done the work. You've learned the skills. You've transformed. Now, continue. Maintain. Thrive. You've got this."
    exercises:
      - "Progress reflection: Reflect on your journey. What have you learned? How have you grown? What's changed?"
      - "Maintenance plan: Create a plan for maintaining secure attachment. What will you do daily? Weekly? Monthly?"
      - "Future vision: Imagine your future with secure attachment. What does it look like? How do you feel? What's different?"
    homework:
