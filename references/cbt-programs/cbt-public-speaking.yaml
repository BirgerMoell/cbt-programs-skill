id: cbt-public-speaking
title: "The Fearless Presenter: Speaking with Confidence"
condition: "Performance Anxiety / Public Speaking Phobia"
summary: "A practical, exposure-based CBT program to transform stage fright into stage presence. You will learn to manage the physiological rush of adrenaline, challenge the 'Spotlight Effect,' structure your message for impact, and build confidence through graded exposure exercises."
duration: "6 modules • 6-8 weeks self-paced"
focusAreas:
  - "Physiological Regulation"
  - "Cognitive Restructuring"
  - "The Spotlight Effect"
  - "Exposure Therapy"
  - "Preparation Strategy"
modules:
  - title: "Module 1 • Reframing the Rush"
    overview:
      - "We normalize the fear: Glossophobia is one of the most common fears. The body perceives the audience as a 'predator pack.'"
      - "We reframe the symptoms: A racing heart is not a heart attack; it is 'energy.' It is the body preparing you to perform."
      - "We distinguish between 'Anxiety' (fear of failure) and 'Excitement' (readiness). Physiologically, they are almost identical."
      - "We introduce 'The Pause.' Learning to stand in silence before speaking to ground the nervous system."
    takeaways:
      - "Adrenaline is fuel; don't try to get rid of it, use it."
      - "The audience wants you to succeed; they are not waiting for you to die."
      - "You don't need to be calm to be effective; you just need to be brave."
    narrative:
      - section: "It's not fear, it's fuel"
        paragraphs:
          - "Your hands shake. Your mouth is dry. Your heart pounds. You think, 'I'm terrified.' But what if you thought, 'I'm ready'?"
          - "Top athletes feel the exact same sensations before a game. They call it 'being in the zone.' You call it 'panic.' The sensation is the same; the label is different. We are going to change the label."
        exerciseAfter: 0
    exercises:
      - "The Re-labeling Drill: Run in place for 1 minute to get your heart rate up. Say out loud: 'I am excited! I am ready!'"
      - "The Power Pose: Practice standing tall (arms out or hands on hips) for 2 minutes before a low-stakes interaction."
    homework:
      - "Practice the Re-labeling Drill daily."
      - "Watch a TED talk and observe how the speaker handles pauses."

  - title: "Module 2 • The Spotlight Effect & Cognitive Distortions"
    overview:
      - "We tackle the 'Spotlight Effect'—the false belief that everyone is noticing every tiny mistake you make."
      - "We challenge 'Mind Reading' ('They look bored, they must hate me')."
      - "We explore 'Perfectionism.' The belief that a good speech must be flawless."
      - "We shift focus from 'How do I look?' to 'What can I give?' (Service mindset)."
    takeaways:
      - "People notice 10% of what you think they notice."
      - "A mistake is not a failure; it makes you relatable."
      - "Focusing on the message (giving) reduces self-consciousness."
    narrative:
      - section: "It's not about you"
        paragraphs:
          - "The paradox of public speaking anxiety is that it is incredibly self-centered. 'Do I look stupid? Is my voice shaking?'"
          - "Flip the script. It's not about you. It's about the audience. It's about the gift of information or inspiration you are giving them. You are just the delivery driver. If the pizza arrives, nobody cares if the driver's hat is crooked."
        exerciseAfter: 0
    exercises:
      - "The Mistake Practice: Record yourself speaking for 1 minute and deliberately stumble or say 'um.' Watch it back. Realize it's not a disaster."
      - "Audience Perspective: Next time you watch a speaker, notice how forgiving you are. Apply that grace to yourself."
    homework:
      - "Record a 2-minute video on a topic you love. Watch it only once, looking for what went *right*."

  - title: "Module 3 • Exposure: Climbing the Stage"
    overview:
      - "We create a hierarchy of speaking situations."
      - "Low stakes: Speaking to a pet, a mirror, a voice memo."
      - "Medium stakes: Asking a question in a meeting, proposing a toast."
      - "High stakes: Giving a presentation."
      - "We use 'Toastmasters' style drills (Table Topics) to practice thinking on your feet."
    takeaways:
      - "Confidence comes from doing, not thinking."
      - "Micro-exposures build tolerance."
      - "Recovery from a stumble is more impressive than a perfect run."
    narrative:
      - section: "Micro-bravery"
        paragraphs:
          - "You don't start by headlining a conference. You start by asking a question at a team meeting. You start by saying a longer 'Thank you' to the barista."
          - "Every time you speak up and survive, you put a coin in the confidence bank. Eventually, you'll have enough savings to buy the big stage."
        exerciseAfter: 0
    exercises:
      - "The Question Challenge: Ask one question in a group setting this week."
      - "The Toast: Propose a short (30-second) toast at dinner with friends or family."
    homework:
      - "Complete one item from your hierarchy."
      - "Sign up for a low-stakes speaking opportunity (or volunteer to present a small update at work)."